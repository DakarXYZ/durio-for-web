# dur.io: the browser client a dur.io server hosts at /web/app/ — image durio-web
# (docker/durio-web), used by durio-self-hosted (WEB_TAG in its .env).
# Tags: `main` and `sha-<short>` on every push to main; `<version>` for a tag web-v<version>.
name: durio web image

on:
  push:
    branches: [main]
    tags: ["web-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build, check and push
    if: github.repository_owner != 'stoatchat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@7b8610a904d57da241e4ddba17fa62b62b15aed4 # use-mise-action-v2.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: No Sentry DSN in our builds
        run: test -z "${VITE_SENTRY_DSN:-}"
      - run: mise install:frozen
      - run: mise assets:fallback
      - run: mise build:deps
      - run: mise build:server

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/durio-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=web-v(.*),group=1

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/durio-web/Dockerfile
          load: true
          tags: durio-web:ci

      - name: Smoke (read-only, no capabilities)
        run: |
          docker run -d --name durio-web --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 durio-web:ci
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8080/web/app/ && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/web/app/ | grep -q '<html'
          curl -fs http://127.0.0.1:8080/web/app/server/x/channel/y | grep -q '<html'
          curl -fsI http://127.0.0.1:8080/web/app/rnnoise/rnnoise.wasm | grep -qi 'application/wasm'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/other)" = 404
          ! docker logs durio-web 2>&1 | grep -q '"level":"error"'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/durio-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
